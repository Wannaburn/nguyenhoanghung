<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4f">
<title>Sổ Kế Hoạch Nhà Hàng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar điều hướng + vùng làm việc dạng bảng điều khiển; trên điện thoại thanh điều hướng nằm dưới đáy */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e9ede6; --line:#d8ded4;
  --ink:#18221d; --muted:#5d6a62; --faint:#8a968e;
  --accent:#1f6b4f; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --saffron:#c98714; --saffron-soft:#f8ecd3;
  --red:#b93a26; --red-soft:#f6e0db; --blue:#2c5f8a; --blue-soft:#dde8f1;
  --plum:#7a3f7a; --teal:#17707a; --clay:#8a5a2b;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --sunk:#1c2621; --line:#2a3630;
  --ink:#e4ebe6; --muted:#a2b0a8; --faint:#76847c;
  --accent:#4fb38a; --accent-ink:#0b1410; --accent-soft:#1d3a2e;
  --saffron:#e6ae4a; --saffron-soft:#3a2f17;
  --red:#ec7b66; --red-soft:#3d221d; --blue:#7fb2dc; --blue-soft:#1c2c3a;
  --plum:#cf93cf; --teal:#5fc3cd; --clay:#d6a26c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunk:#1c2621; --line:#2a3630;
  --ink:#e4ebe6; --muted:#a2b0a8; --faint:#76847c;
  --accent:#4fb38a; --accent-ink:#0b1410; --accent-soft:#1d3a2e;
  --saffron:#e6ae4a; --saffron-soft:#3a2f17;
  --red:#ec7b66; --red-soft:#3d221d; --blue:#7fb2dc; --blue-soft:#1c2c3a;
  --plum:#cf93cf; --teal:#5fc3cd; --clay:#d6a26c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.08rem} h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:700}
.brand b{font-family:var(--font-head);display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--faint);padding:0 6px}

main{padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--font-head);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.bar{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--saffron)} .bar.bad i{background:var(--red)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.icon-btn{border:0;background:transparent;color:var(--faint);padding:4px 6px;border-radius:6px;line-height:1}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.off{background:var(--red-soft);color:var(--red)}
.chip.biz{background:var(--saffron-soft);color:var(--saffron)}
.chip.lunar{background:var(--blue-soft);color:var(--blue)}
.chip.ev{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.doing{background:var(--saffron-soft);color:var(--saffron)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.item .t small{color:var(--muted);display:block;overflow-wrap:anywhere}
.when{min-width:52px;text-align:center;border-radius:8px;background:var(--sunk);padding:4px 6px;line-height:1.1}
.when b{font-family:var(--font-head);font-size:1.05rem;display:block}
.when small{font-size:.68rem;color:var(--muted)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);background:transparent;flex:none;display:grid;place-items:center;padding:0;margin-top:1px;color:var(--accent-ink)}
.check.doing{border-color:var(--saffron);background:linear-gradient(90deg,var(--saffron) 50%,transparent 50%)}
.check.done{background:var(--accent);border-color:var(--accent)}
.item.is-done .t b{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--faint);padding:10px 0;font-size:.88rem}

/* Kế hoạch */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;font-weight:600}
.crumb small{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
.crumb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.crumb.on small{color:var(--accent-ink);opacity:.75}
.sep{color:var(--faint)}
.nodes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.node{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.node:hover{border-color:var(--accent)}
.node.now{box-shadow:inset 0 0 0 2px var(--accent)}
.node .nt{font-family:var(--font-head);font-weight:600}
.node .ns{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ctx{border-left:3px solid var(--saffron);padding-left:10px}

/* Lịch */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dow{background:var(--sunk);text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0}
.cell:hover{background:var(--sunk)}
.cell.out{opacity:.45}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .dn{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .dn b{font-family:var(--font-head);font-size:1rem}
.cell .dn small{font-size:.66rem;color:var(--faint)}
.cell .dn small.l1{color:var(--blue);font-weight:600}
.cell .tag{font-size:.68rem;line-height:1.25;padding:1px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.off{background:var(--red-soft);color:var(--red)}
.tag.biz{background:var(--saffron-soft);color:var(--saffron)}
.tag.lunar{background:var(--blue-soft);color:var(--blue)}
.tag.ev{background:var(--accent-soft);color:var(--accent)}
.tag.pl{background:var(--sunk);color:var(--ink)}
.cell .rv{margin-top:auto;font-size:.68rem;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* Lưu ý tháng */
.month-card{gap:10px}
.month-card.now{box-shadow:inset 0 0 0 2px var(--accent)}
.month-card textarea{min-height:120px;font-size:.86rem;line-height:1.55}
.hol-list{display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.hol-list span{display:flex;gap:6px}
.hol-list em{font-style:normal;color:var(--muted);min-width:38px;font-variant-numeric:tabular-nums}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

.banner{background:var(--saffron-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:60;font-weight:500}


/* Cẩm nang */
.hb-map{display:grid;grid-template-columns:170px repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hb-row{display:contents}
.hb-row>*{background:var(--surface);padding:8px;min-width:0}
.hb-head>div{background:var(--sunk);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hb-dom{border:0;border-left:4px solid var(--dc);text-align:left;display:flex;flex-direction:column;gap:3px}
.hb-dom b{font-family:var(--font-head);font-weight:600;color:var(--dc)}
.hb-dom small{font-size:.72rem;color:var(--muted)}
.hb-dom:hover{background:var(--sunk)}
.hb-cell{display:flex;flex-direction:column;gap:5px}
.hb-cell .fq{display:none}
.task{display:flex;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 7px;font-size:.78rem;line-height:1.3;width:100%}
.task::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dc);flex:none;margin-top:4px}
.task:hover{border-color:var(--dc)}
.task.learned{color:var(--muted)}
.task.learned::before{content:"✓";width:auto;height:auto;background:none;color:var(--dc);margin-top:0;font-weight:700;font-size:.75rem}
.chapter{gap:14px;border-top:4px solid var(--dc)}
.ch-title{font-size:1.5rem;color:var(--dc)}
.lead{font-size:1rem;line-height:1.65;max-width:68ch;margin:0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);text-decoration:none}
.toc a:hover{background:var(--accent-soft)}
.ch-fq{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:8px}
.lesson{display:flex;flex-direction:column;gap:10px;padding:4px 0 14px}
.lesson h3{font-size:1.08rem}
.lesson p{margin:2px 0 0;max-width:72ch;line-height:1.6}
.lesson ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:3px;max-width:72ch;line-height:1.55}
.chip.dom{background:var(--sunk);color:var(--dc)}
.box{border-radius:8px;padding:8px 12px}
.box.ok{background:var(--accent-soft)} .box.bad{background:var(--red-soft)}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:var(--sunk);border-radius:7px;padding:8px 10px;overflow-wrap:anywhere}
.concept p{margin:0;font-size:.86rem;line-height:1.55}
.calc{display:flex;flex-direction:column;gap:8px;min-width:0}
.calc .out{font-size:.88rem;line-height:1.5;background:var(--sunk);border-radius:8px;padding:8px 10px;display:block}
.ck-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ck-list{display:flex;flex-direction:column;max-height:330px;overflow:auto;padding-right:4px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck-t{border:0;background:none;padding:0;text-align:left;flex:1;min-width:0;font-weight:500;line-height:1.35}
.ck-t small{display:block;font-size:.72rem;color:var(--dc);font-weight:500}
.ck-t:hover{color:var(--accent)}
.ck.on .ck-t{text-decoration:line-through;color:var(--muted)}
.nav a .s{display:none}

/* Nhà hàng trực tiếp */
.world{gap:10px}
.timebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timebar input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.clock{font-family:var(--font-head);font-size:1.6rem;font-weight:600;line-height:1;min-width:92px;display:flex;flex-direction:column}
.clock small{font-family:var(--font-body);font-size:.68rem;color:var(--muted);font-weight:500;margin-top:3px}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;background:var(--sunk);border-radius:99px;padding:3px 10px}
.rchip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.rchip small{color:var(--muted)}
.rchip.short{background:var(--red-soft);color:var(--red)}
.cv-wrap{border-radius:10px;overflow:hidden;border:3px solid #33271f;background:#33271f;line-height:0}
#w-cv{width:100%;height:auto;image-rendering:pixelated;cursor:pointer;display:block}
.sel{font-size:.86rem;min-width:0;flex:1}
.kpi.foh{border-top:3px solid var(--accent)} .kpi.boh{border-top:3px solid var(--saffron)}
.kpi.alert{border-top:3px solid var(--red)} .kpi.alert .v{color:var(--red)}
.gantt{min-width:620px;cursor:crosshair}
.gantt text{font-size:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}

/* Chức vụ */
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.role-card{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.role-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.role-card b{font-family:var(--font-head);font-size:1.3rem;color:var(--accent)}
.role-card .rn{font-weight:600}.role-card small{color:var(--muted);font-size:.78rem}
.who:empty{display:none}
.who{margin:0 6px;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.who b{font-family:var(--font-head)}.who button{border:0;background:none;padding:0;color:var(--accent);text-align:left;font-size:.78rem;font-weight:600}
.pv{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:1px 5px;font-weight:700;font-size:.78rem}
.pv-3{background:var(--accent);color:var(--accent-ink)}.pv-2{background:var(--accent-soft);color:var(--accent)}.pv-1{background:var(--blue-soft);color:var(--blue)}.pv-0{color:var(--faint)}
.pv.me{outline:2px solid var(--saffron);outline-offset:1px}
.check.locked{opacity:.45;cursor:not-allowed}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot,.who{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;flex:1;text-align:center}
  main{padding-bottom:96px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)} .span2{grid-column:auto}
  .cell{min-height:64px;padding:4px}
  .cell .tag{font-size:0;padding:0;height:5px;border-radius:3px}
  .cell .rv{display:none}
  .hb-map{display:flex;flex-direction:column;gap:12px;background:none;border:0;overflow:visible}
  .hb-row{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;border-left:4px solid var(--dc)}

const LEVELS=['year','quarter','month','week','day'];
const LV={year:'Năm',quarter:'Quý',month:'Tháng',week:'Tuần',day:'Ngày'};
function period(level,d){
  const y=d.getFullYear(),m=d.getMonth(),q=Math.floor(m/3);
  if(level==='year')return{level,key:`Y${y}`,start:new Date(y,0,1),end:new Date(y,11,31),label:`Năm ${y}`,short:`${y}`};
  if(level==='quarter')return{level,key:`Q${y}-${q+1}`,start:new Date(y,q*3,1),end:new Date(y,q*3+3,0),label:`Quý ${q+1}/${y}`,short:`Quý ${q+1}`};
  if(level==='month')return{level,key:`M${y}-${pad(m+1)}`,start:new Date(y,m,1),end:new Date(y,m+1,0),label:`Tháng ${m+1}/${y}`,short:`Tháng ${m+1}`};
  if(level==='week'){const s=mondayOf(d),e=addDays(s,6);return{level,key:`W${ymd(s)}`,start:s,end:e,label:`Tuần ${isoWeek(s)} (${dm(s)} – ${dm(e)})`,short:`Tuần ${isoWeek(s)}`}}
  return{level:'day',key:`D${ymd(d)}`,start:d,end:d,label:`${DOW_FULL[d.getDay()]}, ${dm(d)}/${y}`,short:`${DOW[d.getDay()]} ${dm(d)}`};
}
function children(p){
  const y=p.start.getFullYear();
  if(p.level==='year')return[0,1,2,3].map(q=>({p:period('quarter',new Date(y,q*3,1)),a:new Date(y,q*3,1)}));
  if(p.level==='quarter')return[0,1,2].map(i=>{const a=new Date(y,p.start.getMonth()+i,1);return{p:period('month',a),a}});
  if(p.level==='month'){const out=[];for(let s=mondayOf(p.start);s<=p.end;s=addDays(s,7))out.push({p:period('week',s),a:s<p.start?p.start:s});return out}
  if(p.level==='week')return[0,1,2,3,4,5,6].map(i=>{const a=addDays(p.start,i);return{p:period('day',a),a}});
  return[];
}
function shift(level,d,n){
  if(level==='year')return new Date(d.getFullYear()+n,0,1);
  if(level==='quarter')return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3+3*n,1);
  if(level==='month')return new Date(d.getFullYear(),d.getMonth()+n,1);
  if(level==='week')return addDays(mondayOf(d),7*n);
  return addDays(d,n);
}

function clearSample(){
  S.plans=S.plans.filter(p=>!p.s);S.events=S.events.filter(e=>!e.s);
  for(const k in S.revenue)if(S.revenue[k].s)delete S.revenue[k];
  (S.sampleTargets||[]).forEach(k=>delete S.targets[k]);S.staff=S.staff.filter(x=>!x.s);for(const k in S.attend){for(const id in S.attend[k]){S.attend[k][id]=S.attend[k][id].filter(r=>!r.s);if(!S.attend[k][id].length)delete S.attend[k][id]}}S.sampleTargets=[];S.sample=false;save();
}

/* ---------- Doanh thu & mục tiêu ---------- */
function revSum(a,b){let sum=0,g=0,n=0;for(let d=a;d<=b;d=addDays(d,1)){const e=S.revenue[ymd(d)];if(e){sum+=e.amount||0;g+=e.guests||0;n++}}return{sum,guests:g,days:n}}
const ex=k=>S.targets[k]!=null?+S.targets[k]:null;
function monthT(d){const y=d.getFullYear(),m=d.getMonth();let v=ex(`M${y}-${pad(m+1)}`);if(v!=null)return v;v=ex(`Q${y}-${Math.floor(m/3)+1}`);if(v!=null)return v/3;v=ex(`Y${y}`);return v!=null?v/12:0}
function dayT(d){const v=ex(`D${ymd(d)}`);return v!=null?v:monthT(d)/dim(d)}
function target(p){
  const v=ex(p.key);if(v!=null)return{v,est:false};
  const y=p.start.getFullYear();let s=0;
  if(p.level==='year'){for(let q=0;q<4;q++)s+=target(period('quarter',new Date(y,q*3,1))).v;return{v:s,est:true}}
  if(p.level==='quarter'){const ms=[0,1,2].map(i=>new Date(y,p.start.getMonth()+i,1));if(ms.some(m=>ex(period('month',m).key)!=null))return{v:ms.reduce((a,m)=>a+monthT(m),0),est:true};const Y=ex(`Y${y}`);return{v:Y!=null?Y/4:0,est:true}}
  if(p.level==='month')return{v:monthT(p.start),est:true};
  for(let d=p.start;d<=p.end;d=addDays(d,1))s+=dayT(d);return{v:s,est:true};
}
function plansIn(p){return S.plans.filter(x=>{const d=parse(x.date);const pp=period(x.level,d);return pp.start>=p.start&&pp.start<=p.end&&LEVELS.indexOf(x.level)>=LEVELS.indexOf(p.level)})}
function prog(list){const t=list.length,d=list.filter(x=>x.status==='done').length,g=list.filter(x=>x.status==='doing').length;return{t,d,pct:t?Math.round((d+g*0.5)/t*100):0}}
const pctCls=(pct,expect)=>pct>=expect?'':pct>=expect*0.8?'warn':'bad';

/* ---------- Lịch làm việc ---------- */
const EVT={meeting:'Họp',staff:'Nhân sự',supplier:'Nhà cung cấp',marketing:'Marketing',other:'Việc khác'};
const REP={none:'Một lần',daily:'Hằng ngày',weekly:'Hằng tuần',monthly:'Hằng tháng',quarterly:'Hằng quý',yearly:'Hằng năm'};
function occurs(ev,d){
  const s=parse(ev.date);if(d<s)return false;
  switch(ev.repeat){
    case 'daily':return true;
    case 'weekly':return d.getDay()===s.getDay();
    case 'monthly':{const last=dim(d);return d.getDate()===s.getDate()||(s.getDate()>last&&d.getDate()===last)}
    case 'quarterly':{const last=dim(d);return (d.getMonth()-s.getMonth()+12)%3===0&&(d.getDate()===s.getDate()||(s.getDate()>last&&d.getDate()===last))}
    case 'yearly':return d.getMonth()===s.getMonth()&&d.getDate()===s.getDate();
    default:return ymd(d)===ev.date;
  }
}
const eventsOn=d=>S.events.filter(e=>occurs(e,d)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

function upcoming(days){
  const t=today(),out=[];
  for(let i=0;i<=days;i++){const d=addDays(t,i);
    holidaysOn(d).forEach(h=>{if(i<=h.lead)out.push({d,i,kind:'hol',type:h.type,title:h.name,tip:h.tip})});
    eventsOn(d).forEach(e=>{const lead=Math.max(e.remind||0,e.repeat==='daily'?0:e.repeat==='weekly'?1:3);if(i<=lead&&!(e.done&&e.done[ymd(d)]))out.push({d,i,kind:'ev',type:'ev',title:e.title,tip:[e.time,EVT[e.type]].filter(Boolean).join(' · '),ev:e})});
  }
  return out;
}

/* ---------- Biểu đồ ---------- */
function niceStep(max,n){const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(labels,vals,tgts,opt={}){
  const W=opt.w||720,H=opt.h||220,L=44,R=8,T=12,B=26,n=vals.length;
  const mx=Math.max(1,...vals,...(tgts||[]).map(v=>v||0));const step=niceStep(mx,4);const top=Math.ceil(mx/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/n;let g='';
  for(let v=0;v<=top+1;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${money(v)}</text>`}
  const every=Math.ceil(n/(opt.maxLabels||16));
  vals.forEach((v,i)=>{const x=L+i*bw+bw*0.15,w=bw*0.7,hi=opt.hi===i;const t=tgts&&tgts[i];const fill=v==null||v===0?'var(--sunk)':t&&v<t*0.9?'var(--saffron)':'var(--accent)';
    g+=`<rect x="${x}" y="${y(v||0)}" width="${w}" height="${Math.max(0,y(0)-y(v||0))}" rx="2" fill="${fill}" opacity="${hi||opt.hi==null?1:.75}"><title>${esc(labels[i])}: ${fmt(v||0)} đ${t?` / mục tiêu ${fmt(t)} đ`:''}</title></rect>`;
    if(i%every===0||hi)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" ${hi?'style="fill:var(--ink);font-weight:700"':''}>${esc(labels[i])}</text>`});
  if(tgts){let d='';tgts.forEach((t,i)=>{if(t==null)return;const x1=L+i*bw,x2=x1+bw;d+=`M${x1} ${y(t)}H${x2}`});g+=`<path d="${d}" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 3" fill="none"/>`}
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'Biểu đồ doanh thu')}">${g}</svg>`;
}

 ['ns-1-1','month','Trò chuyện 1-1 với nhân viên','Người giỏi thường nghỉ vì không được lắng nghe. 10 phút mỗi tháng giúp phát hiện sớm vấn đề.',['Hỏi 3 câu: Em làm tốt điều gì? Điều gì cần cải thiện? Em cần anh/chị hỗ trợ gì?','Ghi lại và hẹn thời điểm xem lại.','Với người thử việc: đánh giá trước khi hết thử việc.'],'Mỗi nhân viên chính thức có ít nhất 1 buổi 1-1 mỗi tháng.','Chỉ gặp riêng khi muốn kỷ luật.'],
 ['ns-tuyen-dung','quarter','Kế hoạch tuyển dụng','Tuyển gấp thường tuyển sai. Cao điểm như cuối năm, sau Tết cần chuẩn bị trước 1–2 tháng.',['Xem lịch các mùa cao điểm và tỷ lệ nghỉ việc.','Dự tính số người cần thêm, thời vụ hay chính thức.','Đăng tuyển sớm, giữ danh sách ứng viên dự phòng.','Chuẩn bị tài liệu đào tạo cho người mới.'],'Không ca nào thiếu người vì tuyển chậm.','Đợi có người nghỉ mới bắt đầu tuyển.'],
 ['ns-xet-luong','year','Xét lương thưởng và hồ sơ','Giữ người giỏi bằng sự công bằng. Hồ sơ đầy đủ giúp tránh rủi ro pháp lý.',['Tổng hợp đánh giá cả năm của từng người.','Đề xuất tăng lương, thưởng Tết.','Rà hợp đồng lao động, bảo hiểm, giấy khám sức khỏe.','Đưa các ngày hết hạn vào Lịch nhắc việc.'],'100% nhân viên có hợp đồng và giấy tờ còn hạn.','Thưởng theo cảm tính, không có tiêu chí.']
]},
{id:'hang-hoa',name:'Hàng hóa & kho',col:'--saffron',intro:'Nguyên liệu là khoản chi lớn nhất của nhà hàng. Một quán thất thoát 3% giá vốn có thể mất cả tháng lợi nhuận mỗi năm. Quản lý kho tốt là nhận đúng, giữ đúng, dùng đúng và biết chính xác hàng đi đâu.',tasks:[
 ['hh-nhan-hang','day','Nhận hàng đúng quy trình','Ký nhận rồi là chấp nhận. Hàng thiếu cân, kém chất lượng nếu không phát hiện lúc nhận thì quán chịu thiệt.',['Cân hàng, đếm số lượng, so với đơn đặt.','Kiểm tra chất lượng: màu, mùi, độ tươi.','Đo nhiệt độ hàng đông lạnh, xem hạn dùng.','Từ chối ngay hàng không đạt, ghi biên bản.','Cất hàng lạnh vào tủ trong vòng 15–30 phút.'],'Mọi lần nhận hàng đều được cân và kiểm, có chữ ký.','Ký nhận khi chưa cân, hoặc để hàng lạnh ngoài trời lâu.'],
 ['hh-fifo','day','Sơ chế theo dự báo và FIFO','Sơ chế quá nhiều thì hủy, quá ít thì hết món giữa ca. FIFO (nhập trước dùng trước) giảm hàng hết hạn.',['Lập bảng sơ chế dựa trên doanh thu dự kiến của ngày.','Dán nhãn ngày sơ chế và hạn dùng lên mọi hộp.','Xếp hàng mới vào trong, hàng cũ ra ngoài.','Cuối ngày ghi lại món nào thừa, món nào hết.'],'Hàng trong tủ đều có nhãn ngày; ít hết món giữa ca.','Sơ chế theo thói quen, không theo dự báo.'],
 ['hh-huy','day','Ghi sổ hàng hủy','Hàng hủy không ghi là thất thoát không ai thấy. Có số liệu mới biết nên sửa ở đâu.',['Mọi thứ bỏ đi đều ghi: tên, số lượng, lý do, người ghi.','Phân loại lý do: hư, hết hạn, làm sai món, khách trả.','Cuối tuần xem món nào hủy nhiều nhất.'],'Sổ hủy có ghi mỗi ngày; giá trị hủy giảm dần theo tháng.','Nhân viên sợ bị phạt nên giấu hàng hủy.'],
 ['hh-dat-hang','week','Đặt hàng theo mức tồn chuẩn','Đặt hàng theo cảm tính dễ thừa (vốn đọng, hư) hoặc thiếu (hết món). Mức tồn chuẩn giúp đặt đúng.',['Xác định mức tồn chuẩn (par) cho mỗi mặt hàng chính (xem Kiến thức).','Kiểm tồn thực tế trước khi đặt.','Số cần đặt = mức tồn chuẩn − tồn hiện tại.','Tăng thêm cho tuần có lễ hoặc tiệc lớn.'],'Ít hết hàng, ít hàng tồn quá hạn.','Đặt theo số lượng cố định tuần nào cũng như tuần nào.'],
 ['hh-kiem-nhanh','week','Kiểm kê nhanh hàng giá trị cao','Thịt bò, hải sản, rượu là nơi thất thoát gây thiệt hại lớn nhất. Kiểm hằng tuần phát hiện sớm.',['Chọn 10–15 mặt hàng đắt nhất.','Đếm tồn thực tế, so với số lẽ ra phải còn.','Chênh lệch lớn: kiểm tra lại sổ nhập, sổ hủy, định lượng.'],'Chênh lệch dưới 2% với hàng giá trị cao.','Chỉ kiểm kê cuối tháng, phát hiện thì đã muộn.'],
 ['hh-kiem-ke','month','Kiểm kê toàn bộ và tính giá vốn','Đây là con số cho biết quán có đang lãi đúng như tính toán hay không.',['Kiểm kê toàn bộ kho vào cùng một thời điểm cuối tháng.','Giá vốn thực tế = tồn đầu kỳ + nhập trong kỳ − tồn cuối kỳ.','Chia cho doanh thu để ra % giá vốn.','So với giá vốn lý thuyết (theo định lượng món), tìm nguyên nhân chênh lệch.'],'Giá vốn thực tế lệch không quá 2–3% so với lý thuyết.','Kiểm kê mỗi tháng một kiểu, số liệu không so sánh được.'],
 ['hh-ncc','quarter','Đánh giá nhà cung cấp','Giá nguyên liệu thay đổi liên tục. Không so sánh thì không biết mình đang mua đắt.',['Chấm điểm nhà cung cấp: giá, chất lượng, giao đúng giờ, xử lý đổi trả.','Lấy ít nhất 3 báo giá cho mặt hàng chính.','Thương lượng lại giá hoặc đổi nhà cung cấp nếu cần.','Luôn có nhà cung cấp dự phòng.'],'Mặt hàng chính có ít nhất 2 nhà cung cấp.','Phụ thuộc một nhà cung cấp, bị tăng giá mà không biết.']
]},
{id:'tai-chinh',name:'Doanh thu & tài chính',col:'--clay',intro:'Quản lý không cần là kế toán, nhưng phải đọc được con số. Doanh thu cho biết quán bán được bao nhiêu; lợi nhuận mới cho biết quán có sống được không. Biết vài chỉ số chính là đủ để ra quyết định đúng.',tasks:[
 ['tc-chot-ket','day','Chốt doanh thu và két','Tiền là nơi dễ sai sót và gian lận nhất. Đối chiếu mỗi ngày giúp phát hiện ngay.',['Đối chiếu tổng POS với tiền mặt, chuyển khoản, thẻ, app giao hàng.','Ghi rõ chênh lệch và lý do.','Kiểm tra các hóa đơn hủy, giảm giá trong ngày.','Nhập doanh thu và số khách vào mục Doanh thu của app.'],'Chênh lệch két bằng 0 hoặc có giải trình.','Bỏ qua chênh lệch nhỏ, lâu dần thành lớn.'],
 ['tc-muc-tieu-ngay','day','So doanh thu với mục tiêu ngày','Biết sớm ngày hôm nay hụt bao nhiêu thì còn kịp xoay xở trong tuần.',['Xem ô Hôm nay ở trang Tổng quan.','Nếu hụt nhiều ngày liền: tìm nguyên nhân (thời tiết, đối thủ, chất lượng).','Đề xuất hành động: khuyến mãi giờ vắng, đẩy giao hàng, gọi khách quen.'],'Biết được tình trạng doanh thu mỗi ngày.','Chỉ xem doanh thu khi hết tháng.'],
 ['tc-bao-cao-tuan','week','Xem lại số liệu tuần','Một tuần đủ dài để thấy xu hướng, đủ ngắn để kịp sửa.',['So doanh thu, số khách, trung bình mỗi khách với tuần trước và mục tiêu.','Ngày nào lệch hơn 10%: tìm nguyên nhân.','Ghi 1–3 hành động cho tuần sau.'],'Có nhận định và hành động mỗi tuần, không chỉ có số.','Báo cáo chỉ liệt kê số, không giải thích.'],
 ['tc-lai-lo','month','Lãi lỗ đơn giản hằng tháng','Doanh thu tăng chưa chắc lãi tăng. Phải trừ hết chi phí mới biết quán đang ở đâu.',['Doanh thu − giá vốn − lương − chi phí cố định (mặt bằng, điện nước, khấu hao) − chi phí khác = lợi nhuận.','Tính tỷ lệ giá vốn + lương trên doanh thu (prime cost).','So với tháng trước và cùng kỳ năm trước.'],'Prime cost thường nên dưới 60–65% doanh thu (tham khảo).','Chỉ nhìn doanh thu, bỏ qua chi phí.'],
 ['tc-chi-phi','month','Kiểm soát chi phí vận hành','Điện, gas, nước, vật dụng tiêu hao tăng âm thầm từng chút.',['So từng khoản chi với tháng trước.','Khoản nào tăng hơn 10% mà doanh thu không tăng: tìm nguyên nhân.','Đặt quy định đơn giản: tắt máy lạnh khu không khách, kiểm tra rò gas, nước.'],'Chi phí vận hành tăng không nhanh hơn doanh thu.','Coi điện nước là chi phí cố định không quản được.'],
 ['tc-thuc-don','quarter','Phân tích thực đơn','Không phải món bán chạy nào cũng mang lại lãi. Phân tích giúp biết món nào giữ, món nào sửa, món nào bỏ.',['Lấy số lượng bán và lãi gộp của từng món trong quý.','Chia 4 nhóm theo Kiến thức → Phân tích thực đơn.','Quyết định: giữ, tăng giá, đẩy bán hoặc bỏ.'],'Thực đơn được rà lại ít nhất mỗi quý.','Giữ món vì cảm tình dù vừa ít khách gọi vừa lãi thấp.'],
 ['tc-ngan-sach','year','Lập ngân sách năm sau','Mục tiêu rõ thì cả đội biết phải chạy tới đâu. Chia theo mùa thì mục tiêu thực tế hơn.',['Xem doanh thu từng tháng năm nay, tính tăng trưởng mong muốn.','Chia mục tiêu theo mùa: tháng cao điểm cao hơn, tháng 7 âm thấp hơn.','Dự trù chi phí lớn: sửa chữa, tuyển dụng, marketing.','Nhập mục tiêu năm và từng tháng vào mục Kế hoạch của app.'],'Có mục tiêu cho từng tháng trước ngày 31/12.','Lấy năm cũ cộng 10% cho mọi tháng.']
]},
{id:'khach-hang',name:'Khách hàng & dịch vụ',col:'--plum',intro:'Khách quay lại vì cảm giác được chăm sóc nhiều hơn vì giảm giá. Một lời phàn nàn được xử lý tốt có thể biến khách khó tính thành khách trung thành. Quản lý là người giữ chuẩn trải nghiệm đó.',tasks:[
 ['kh-phan-nan','day','Chào bàn và xử lý phàn nàn','Phần lớn khách không hài lòng sẽ không nói mà chỉ không quay lại. Chào bàn giúp nghe được trước khi khách bỏ đi.',['Ghé bàn khi khách đã ăn được vài miếng, hỏi ngắn gọn.','Khi khách phàn nàn: lắng nghe hết, không cắt lời.','Xin lỗi chân thành, không đổ lỗi cho bếp hay nhân viên.','Đưa giải pháp ngay: đổi món, tặng món, giảm giá tùy mức độ.','Cảm ơn khách đã góp ý và ghi lại vào sổ.'],'Mọi phàn nàn được xử lý ngay trong lúc khách còn ở quán.','Tranh cãi đúng sai với khách.'],
 ['kh-dat-ban','day','Kiểm tra đặt bàn và tiệc','Khách đặt trước là khách có kỳ vọng cao. Sai sót ở đây gây ấn tượng xấu khó gỡ.',['Gọi xác nhận các bàn đặt trong ngày.','Ghi chú đặc biệt: dị ứng, sinh nhật, ghế trẻ em.','Sắp bàn và báo bếp trước số lượng tiệc.'],'Không có sai sót với bàn đặt trước.','Nhận đặt bàn bằng tin nhắn rồi quên ghi sổ.'],
 ['kh-danh-gia','week','Trả lời đánh giá online','Khách mới đọc đánh giá trước khi đến. Cách quán trả lời quan trọng không kém điểm số.',['Xem đánh giá trên Google Maps, mạng xã hội và app giao hàng.','Trả lời trong 24–48 giờ, cả khen lẫn chê.','Đánh giá xấu: xin lỗi, giải thích ngắn, mời khách quay lại.','Chuyển nội dung góp ý cho bếp hoặc đội phục vụ.'],'Mọi đánh giá đều được trả lời.','Trả lời cãi nhau công khai với khách.'],
 ['kh-tu-danh-gia','week','Tự đóng vai khách','Người làm lâu trong quán dễ quen mắt với lỗi. Nhìn bằng mắt khách sẽ thấy điều khác.',['Vào quán từ cửa chính như khách.','Chấm theo checklist: chào đón, thời gian chờ, món ăn, vệ sinh, thanh toán.','Ghi 3 điểm cần sửa và giao người phụ trách.'],'Mỗi tuần có một bản tự đánh giá.','Chỉ nhìn từ trong bếp và quầy.'],
 ['kh-tong-hop','month','Tổng hợp phản hồi khách','Một lời phàn nàn là sự cố, lặp lại nhiều lần là vấn đề hệ thống.',['Gom phản hồi trong tháng từ sổ, đánh giá online, nhân viên.','Chọn ra 3 vấn đề lặp lại nhiều nhất.','Đặt hành động cụ thể, đưa vào Kế hoạch tháng sau.'],'Mỗi tháng có ít nhất 1 cải tiến từ phản hồi khách.','Xử lý từng vụ mà không nhìn tổng thể.'],
 ['kh-khach-quen','quarter','Chăm sóc khách quen và khách đoàn','Giữ khách cũ rẻ hơn nhiều so với tìm khách mới.',['Lập danh sách khách quen, công ty hay đặt tiệc.','Chương trình tích điểm hoặc ưu đãi sinh nhật.','Gửi lời chào và ưu đãi trước mùa tiệc cuối năm.'],'Tỷ lệ khách quay lại tăng.','Chỉ chạy khuyến mãi cho khách mới.']
]},
{id:'an-toan',name:'An toàn thực phẩm & pháp lý',col:'--red',intro:'Một vụ ngộ độc hay cháy nổ có thể đóng cửa nhà hàng. Phần này ít khi gây chú ý khi mọi thứ ổn, nhưng là trách nhiệm không thể bỏ qua của quản lý. Quy định cụ thể có thể thay đổi, hãy hỏi cơ quan quản lý địa phương khi chưa rõ.',tasks:[
 ['at-nhiet-do','day','Kiểm tra nhiệt độ bảo quản','Vi khuẩn phát triển nhanh nhất trong vùng nhiệt độ từ 5°C đến 60°C. Tủ hỏng một đêm có thể làm hỏng cả kho.',['Đo và ghi nhiệt độ tủ mát, tủ đông 2 lần mỗi ngày.','Tủ mát: 0–5°C. Tủ đông: −18°C hoặc lạnh hơn.','Lệch chuẩn: chuyển hàng sang tủ khác, gọi thợ, kiểm tra hàng bên trong.'],'Sổ nhiệt độ ghi đủ 2 lần/ngày, không có lần nào vượt chuẩn mà không xử lý.','Chỉ ghi số cho đủ mà không thật sự đo.'],
 ['at-ve-sinh-ca-nhan','day','Vệ sinh cá nhân nhân viên bếp','Tay và cơ thể nhân viên là nguồn lây nhiễm phổ biến nhất.',['Kiểm tra đồng phục, mũ, tạp dề sạch.','Móng tay ngắn, không đeo trang sức khi chế biến.','Rửa tay đúng cách khi vào bếp và sau khi đi vệ sinh.','Người đang bị tiêu chảy, sốt, vết thương hở không chế biến thực phẩm.'],'100% nhân viên bếp đạt chuẩn khi vào ca.','Để người đang bệnh tiếp tục đứng bếp vì thiếu người.'],
 ['at-luu-mau','day','Lưu mẫu thức ăn khi phục vụ tiệc','Khi có nghi ngờ ngộ độc, mẫu lưu là bằng chứng bảo vệ quán.',['Áp dụng cho tiệc, suất ăn số lượng lớn theo hướng dẫn của Bộ Y tế (Quyết định 1246/QĐ-BYT).','Lưu mẫu mỗi món trong hộp sạch có nắp, dán nhãn tên món, giờ lấy mẫu, người lấy.','Bảo quản lạnh và giữ ít nhất 24 giờ.','Ghi sổ kiểm thực theo quy định nếu quán thuộc diện áp dụng.'],'Mọi tiệc đều có mẫu lưu và sổ ghi chép.','Chỉ lưu mẫu khi biết có đoàn kiểm tra.'],
 ['at-con-trung','week','Kiểm soát côn trùng và rác','Gián, chuột là lỗi nặng khi bị kiểm tra và gây mất uy tín nếu khách thấy.',['Kiểm tra dấu vết côn trùng ở kho, gầm bếp, cống.','Rác có nắp đậy, đổ đúng giờ.','Bịt các khe hở, kiểm tra lưới chắn cống.','Có hợp đồng diệt côn trùng định kỳ.'],'Không phát hiện côn trùng trong khu chế biến.','Chỉ xịt thuốc khi đã thấy côn trùng.'],
 ['at-pccc','month','Kiểm tra phòng cháy chữa cháy','Bếp có lửa, gas và dầu mỡ. Một sự cố nhỏ không được xử lý đúng có thể thành thảm họa.',['Bình chữa cháy còn áp, còn hạn, đặt đúng vị trí.','Lối thoát hiểm thông thoáng, đèn chỉ dẫn hoạt động.','Kiểm tra van gas, ống dẫn gas.','Nhân viên mới được hướng dẫn cách dùng bình chữa cháy.'],'Biên bản kiểm tra hằng tháng đầy đủ.','Chất hàng chắn lối thoát hiểm.'],

function taskChip(x){const l=S.learn[x.id];return`<button class="task ${l?'learned':''}" style="--dc:var(${x.d.col})" data-act="lesson" data-id="${x.id}">${esc(x.t)}</button>`}

  return`<section class="lesson" style="--dc:var(${x.d.col})">${inModal?'':`<h3>${esc(x.t)}</h3>`}
  <div class="row"><span class="chip dom">${esc(x.d.name)}</span><span class="chip">${FQL[x.f]}</span>${l?'<span class="chip done">Đã học</span>':''}</div>

  <div class="ls box ok"><span class="lbl">Chuẩn cần đạt</span><p>${esc(x.kpi)}</p></div>
  <div class="ls box bad"><span class="lbl">Lỗi hay gặp</span><p>${esc(x.err)}</p></div>

function hbMap(){

function hbChapter(id){
  const d=HB.find(x=>x.id===id),i=HB.indexOf(d),ts=ALL_TASKS.filter(x=>x.d===d),prev=HB[i-1],next=HB[i+1];
  const nav=`<div class="row">${prev?`<button class="btn" data-act="hb-dom" data-id="${prev.id}">‹ ${esc(prev.name)}</button>`:''}<span class="spacer"></span>${next?`<button class="btn" data-act="hb-dom" data-id="${next.id}">${esc(next.name)} ›</button>`:''}</div>`;
  return`<div class="row"><button class="btn" data-act="hb-back">‹ Bản đồ công việc</button></div>
  <article class="panel chapter" style="--dc:var(${d.col})"><span class="lbl">Chương ${i+1} / ${HB.length}</span><h2 class="ch-title">${esc(d.name)}</h2><p class="lead">${esc(d.intro)}</p>
  <nav class="toc">${ts.map(x=>`<a href="#cam-nang" data-act="toc" data-id="${x.id}">${FQL[x.f]} · ${esc(x.t)}${S.learn[x.id]?' ✓':''}</a>`).join('')}</nav>

}

function ganttSVG(info){

  });

function vDash(){
  const t=today(),l=lunar(t);
  const ps=['day','week','month','quarter','year'].map(L=>period(L,t));
  const kp=(p,lab)=>{const r=revSum(p.start,p.end<t?p.end:t).sum,tg=target(p).v;const el=diffDays(p.start,t)+1,tot=diffDays(p.start,p.end)+1;const exp=Math.min(100,el/tot*100);const pct=tg?Math.round(r/tg*100):0;
    return`<div class="panel kpi"><span class="lbl">${lab}</span><span class="v">${money(r)}</span><div class="bar ${tg?pctCls(pct,exp):''}"><i style="width:${Math.min(100,pct)}%"></i></div><span class="sub">${tg?`${pct}% mục tiêu ${money(tg)}${p.level!=='day'?` · thời gian đã qua ${Math.round(exp)}%`:''}`:'Chưa đặt mục tiêu'}</span></div>`};
  const up=upcoming(45);
  const todays=[...S.plans.filter(x=>x.key===ps[0].key),...S.plans.filter(x=>x.key===ps[1].key&&x.status!=='done')];
  const last=[];for(let i=13;i>=0;i--)last.push(addDays(t,-i));
  const chart=barChart(last.map(d=>dm(d)),last.map(d=>(S.revenue[ymd(d)]||{}).amount||0),last.map(d=>dayT(d)),{hi:13,h:200,aria:'Doanh thu 14 ngày gần nhất'});
  const note=(S.notes[t.getMonth()+1]??MONTH_NOTES[t.getMonth()+1]);
  const pr=ps.slice(1).map(p=>{const g=prog(plansIn(p));return`<div class="row"><span style="width:62px" class="muted">${LV[p.level]}</span><div class="bar spacer"><i style="width:${g.pct}%"></i></div><span class="num" style="width:74px;text-align:right">${g.d}/${g.t} xong</span></div>`}).join('');
  return`${sampleBanner()}
  <div class="head"><div><span class="lbl">${DOW_FULL[t.getDay()]} · Tuần ${isoWeek(t)}${myRole()?' · '+esc(roleLabel()):''}</span><h1>${pad(t.getDate())} tháng ${t.getMonth()+1}, ${t.getFullYear()}</h1><p>Âm lịch: ngày ${l.d} tháng ${l.m}${l.leap?' nhuận':''} năm ${canChi(l.y)}</p></div>
  <div class="row"><button class="btn" data-act="quick-rev">Nhập doanh thu hôm nay</button><button class="btn pri" data-act="new-plan" data-l="day" data-d="${ymd(t)}">+ Việc hôm nay</button></div></div>
  ${can('dtCH')?`<div class="grid g4">${kp(ps[0],'Hôm nay')}${kp(ps[1],'Tuần này')}${kp(ps[2],`Tháng ${t.getMonth()+1}`)}${kp(ps[4],`Năm ${t.getFullYear()}`)}</div>`:''}
  ${can('checklist')?dashChecklist():''}
  <div class="grid g3">
    <div class="panel"><div class="panel-h"><h2>Việc cần làm</h2><a class="btn sm" href="#ke-hoach" data-act="goto-plan" data-l="day">Mở kế hoạch ngày</a></div>
      <div class="list">${todays.length?todays.map(planItem).join(''):`<div class="empty">Chưa có việc cho hôm nay. Thêm việc để theo dõi.</div>`}</div>
      ${eventsOn(t).length?`<span class="lbl">Lịch hôm nay</span><div class="list">${eventsOn(t).map(e=>evItem(e,t)).join('')}</div>`:''}
    </div>
    <div class="panel"><div class="panel-h"><h2>Sắp tới</h2><a class="btn sm" href="#lich">Xem lịch</a></div>
      <div class="list">${up.length?up.slice(0,9).map(upItem).join(''):`<div class="empty">Không có ngày lễ hay việc nào cần nhắc.</div>`}</div></div>
    ${!can('luuY')?'':`<div class="panel"><div class="panel-h"><h2>Lưu ý tháng ${t.getMonth()+1}</h2><a class="btn sm" href="#luu-y">Sửa</a></div>
      <div style="white-space:pre-line;font-size:.88rem">${esc(note)}</div></div>`}
  </div>

    <div class="panel span2"><div class="panel-h"><h2>Doanh thu 14 ngày</h2><span class="legend"><span><b style="color:var(--accent)">■</b> Đạt</span><span><b style="color:var(--saffron)">■</b> Dưới 90% mục tiêu</span><span><b style="color:var(--red)">- -</b> Mục tiêu ngày</span></span></div>${chart}</div>

/* ---------- Kế hoạch ---------- */
function vPlans(){

  const crumbs=LEVELS.map(L=>{const pp=period(L,d);return`<button class="crumb ${L===lv?'on':''}" data-act="plvl" data-l="${L}"><small>${LV[L]}</small>${esc(pp.short)}</button>`}).join('<span class="sep">›</span>');
  const kids=children(p).map(({p:c,a})=>{const g=prog(plansIn(c)),r=revSum(c.start,c.end).sum,tg=target(c).v,pct=tg?Math.round(r/tg*100):0,now=t>=c.start&&t<=c.end;
    const hol=c.level==='day'?holidaysOn(c.start).filter(h=>h.type!=='lunar'||/Rằm|Mùng 1/.test(h.name)).slice(0,1):[];
    return`<button class="node ${now?'now':''}" data-act="drill" data-l="${c.level}" data-d="${ymd(a)}"><span class="nt">${esc(c.short)}${c.level==='month'||c.level==='day'?'':''}</span>
      ${c.level==='week'?`<span class="faint" style="font-size:.75rem">${dm(c.start)} – ${dm(c.end)}</span>`:''}
      ${hol.map(h=>`<span class="chip ${h.type}">${esc(h.name)}</span>`).join('')}
      <span class="ns"><span>Kế hoạch</span><span class="num">${g.d}/${g.t}</span></span><div class="bar"><i style="width:${g.pct}%"></i></div>
      <span class="ns"><span>Doanh thu</span><span class="num">${money(r)}${tg?` · ${pct}%`:''}</span></span><div class="bar ${tg?pctCls(pct,100):''}"><i style="width:${Math.min(100,pct)}%;${!tg?'background:var(--faint)':''}"></i></div></button>`}).join('');
  const mine=S.plans.filter(x=>x.key===p.key);
  const order={doing:0,todo:1,done:2};mine.sort((a,b)=>order[a.status]-order[b.status]);
  const parents=LEVELS.slice(0,LEVELS.indexOf(lv)).map(L=>{const pp=period(L,d);const ls=S.plans.filter(x=>x.key===pp.key);return ls.length?`<div class="ctx"><span class="lbl">${esc(pp.label)}</span><div class="list">${ls.map(planItem).join('')}</div></div>`:''}).join('');
  const tg=target(p),r=revSum(p.start,p.end).sum,g=prog(mine);
  const ev=lv==='day'?eventsOn(d):[];const hols=lv==='day'?holidaysOn(d):[];
  return`${sampleBanner()}
  <div class="head"><div><span class="lbl">Kế hoạch theo kỳ</span><h1>${esc(p.label)}</h1><p>Chọn kỳ ở thanh dưới, bấm vào ô con để đi sâu từ năm xuống tới ngày.</p></div>
    <div class="row"><button class="btn" data-act="pshift" data-n="-1" aria-label="Kỳ trước">‹ Trước</button><button class="btn" data-act="ptoday">Hôm nay</button><button class="btn" data-act="pshift" data-n="1" aria-label="Kỳ sau">Sau ›</button></div></div>
  <div class="crumbs">${crumbs}</div>
  ${kids?`<div class="nodes">${kids}</div>`:''}
  <div class="grid g3">

      <div class="list">${mine.length?mine.map(planItem).join(''):`<div class="empty">Chưa có kế hoạch nào cho kỳ này.</div>`}</div>
      ${ev.length?`<span class="lbl">Lịch làm việc trong ngày</span><div class="list">${ev.map(e=>evItem(e,d)).join('')}</div>`:''}
    </div>
    ${!can('dtCH')?'':`<div class="panel"><h2>Mục tiêu doanh thu</h2>
      <div class="kpi"><span class="v">${money(r)}</span><div class="bar ${tg.v?pctCls(tg.v?r/tg.v*100:0,100):''}"><i style="width:${tg.v?Math.min(100,r/tg.v*100):0}%"></i></div><span class="sub">${tg.v?`${Math.round(r/tg.v*100)}% của ${money(tg.v)}${tg.est?' (tự tính từ kỳ khác)':''}`:'Chưa có mục tiêu'}</span></div>
      <form class="form" data-form="target" data-k="${p.key}"><label class="wide">Đặt mục tiêu riêng cho ${esc(p.short.toLowerCase())}<input type="text" id="tg-${p.key}" name="v" inputmode="decimal" placeholder="VD: 900tr, 1,2 tỷ" value="${ex(p.key)!=null?esc(money(ex(p.key))):''}"></label><button class="btn pri">Lưu</button>${ex(p.key)!=null?`<button class="btn" type="button" data-act="clear-target" data-k="${p.key}">Bỏ</button>`:''}</form>
      <p class="muted" style="margin:0;font-size:.8rem">Không đặt riêng thì app chia từ kỳ lớn hơn (năm → quý → tháng → ngày) hoặc cộng từ các tháng đã đặt.</p>

    </div>`}

  ${parents?`<div class="panel"><h2>Kế hoạch cấp trên đang áp dụng</h2>${parents}</div>`:''}`;

/* ---------- Doanh thu ---------- */
function vRevenue(){
  const m=U.revMonth,p=period('month',m),t=today(),y=m.getFullYear();
  const r=revSum(p.start,p.end),tg=target(p).v;
  const days=[];for(let d=p.start;d<=p.end;d=addDays(d,1))days.push(d);
  const isCur=t>=p.start&&t<=p.end;
  const chart=barChart(days.map(d=>String(d.getDate())),days.map(d=>(S.revenue[ymd(d)]||{}).amount||0),days.map(dayT),{hi:isCur?t.getDate()-1:null,maxLabels:31,aria:`Doanh thu từng ngày ${p.label}`});
  const months=[...Array(12)].map((_,i)=>period('month',new Date(y,i,1)));
  const ychart=barChart(months.map(x=>'T'+(x.start.getMonth()+1)),months.map(x=>revSum(x.start,x.end).sum),months.map(x=>target(x).v||null),{hi:y===t.getFullYear()?t.getMonth():null,aria:`Doanh thu theo tháng năm ${y}`});
  const rows=days.filter(d=>S.revenue[ymd(d)]).reverse().map(d=>{const e=S.revenue[ymd(d)],dt=dayT(d);return`<tr><td>${DOW[d.getDay()]} ${dm(d)}</td><td class="r num">${fmt(e.amount)}</td><td class="r num">${dt?Math.round(e.amount/dt*100)+'%':'–'}</td><td class="r num">${e.guests||'–'}</td><td class="r num">${e.guests?fmt(e.amount/e.guests):'–'}</td><td>${esc(e.note||'')}</td><td class="r"><button class="icon-btn" data-act="edit-rev" data-d="${ymd(d)}" aria-label="Sửa">✎</button><button class="icon-btn" data-act="del-rev" data-d="${ymd(d)}" aria-label="Xóa">✕</button></td></tr>`}).join('');
  const best=days.reduce((b,d)=>{const v=(S.revenue[ymd(d)]||{}).amount||0;return v>b.v?{v,d}:b},{v:0,d:null});
  const passed=isCur?t.getDate():p.end<t?dim(m):0;const forecast=r.days?r.sum/r.days*dim(m):0;
  return`${sampleBanner()}
  <div class="head"><div><span class="lbl">Theo dõi doanh thu</span><h1>${esc(p.label)}</h1></div>
    <div class="row"><button class="btn" data-act="rshift" data-n="-1">‹</button><button class="btn" data-act="rtoday">Tháng này</button><button class="btn" data-act="rshift" data-n="1">›</button></div></div>

function vCal(){
  const m=U.calMonth,t=today(),start=mondayOf(m);const end=addDays(mondayOf(new Date(m.getFullYear(),m.getMonth()+1,0)),6);
  let cells='';
  for(let d=start;d<=end;d=addDays(d,1)){
    const l=lunar(d),hs=holidaysOn(d),es=eventsOn(d),ps=S.plans.filter(x=>x.key===`D${ymd(d)}`),rv=S.revenue[ymd(d)];
    const ls=l.d===1?`${l.d}/${l.m}${l.leap?'N':''}`:String(l.d);
    const tags=[...hs.map(h=>`<span class="tag ${h.type}" title="${esc(h.name)}">${esc(h.name)}</span>`),...es.map(e=>`<span class="tag ev" title="${esc(e.title)}">${e.time?e.time+' ':''}${esc(e.title)}</span>`),...(ps.length?[`<span class="tag pl">${ps.length} việc</span>`]:[])];
    cells+=`<button class="cell ${d.getMonth()!==m.getMonth()?'out':''} ${+d===+t?'today':''}" data-act="day" data-d="${ymd(d)}"><span class="dn"><b class="num">${d.getDate()}</b><small class="${l.d===1||l.d===15?'l1':''}">${ls}</small></span>${tags.slice(0,3).join('')}${tags.length>3?`<span class="faint" style="font-size:.66rem">+${tags.length-3}</span>`:''}${rv?`<span class="rv num">${money(rv.amount)}</span>`:''}</button>`;
  }
  const evs=[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item"><div class="t"><b>${esc(e.title)}</b><small>${REP[e.repeat]} · từ ${dm(parse(e.date))}/${parse(e.date).getFullYear()}${e.time?' · '+e.time:''} · ${EVT[e.type]||''}${e.remind?` · nhắc trước ${e.remind} ngày`:''}</small></div><button class="icon-btn" data-act="edit-ev" data-id="${e.id}" aria-label="Sửa">✎</button></div>`).join('');
  const hol=Object.entries(holidaysOfYear(m.getFullYear())).filter(([k])=>parse(k).getMonth()===m.getMonth()).flatMap(([k,arr])=>arr.filter(h=>h.type!=='lunar'||!/^(Mùng 1|Rằm) tháng/.test(h.name)).map(h=>`<div class="item"><div class="when"><b class="num">${parse(k).getDate()}</b><small>${DOW[parse(k).getDay()]}</small></div><div class="t"><b>${esc(h.name)}</b><small>${esc(h.tip)}</small></div><span class="chip ${h.type}">${h.type==='off'?'Nghỉ lễ':h.type==='biz'?'Kinh doanh':'Âm lịch'}</span></div>`)).join('');
  return`<div class="head"><div><span class="lbl">Lịch làm việc · Ngày lễ · Âm lịch</span><h1>Tháng ${m.getMonth()+1}/${m.getFullYear()}</h1></div>
    <div class="row"><button class="btn" data-act="cshift" data-n="-1">‹</button><button class="btn" data-act="ctoday">Tháng này</button><button class="btn" data-act="cshift" data-n="1">›</button><button class="btn pri" data-act="new-ev" data-d="${ymd(t>=m&&t<=addDays(new Date(m.getFullYear(),m.getMonth()+1,1),-1)?t:m)}">+ Lịch / nhắc việc</button></div></div>
  <div class="legend"><span><span class="chip off">Nghỉ lễ</span></span><span><span class="chip biz">Dịp kinh doanh</span></span><span><span class="chip lunar">Âm lịch</span></span><span><span class="chip ev">Lịch làm việc</span></span><span>Số nhỏ góc phải là ngày âm lịch</span></div>
  <div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
  <div class="grid g2">
    <div class="panel"><h2>Ngày lễ & dịp đáng chú ý trong tháng</h2><div class="list">${hol||'<div class="empty">Không có.</div>'}</div></div>
    <div class="panel"><div class="panel-h"><h2>Lịch làm việc định kỳ</h2></div><div class="list">${evs||'<div class="empty">Chưa có lịch. Thêm họp giao ban, chốt lương, kiểm kho…</div>'}</div></div>
  </div>`;
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,ds=b.dataset;
  if(a==='close-bg'){if(ev.target===b&&!b.dataset.lockedModal)closeModal();return}
  if(a==='change-role'){roleModal();return}
  if(a==='pick-role'){profileModal(ds.r);return}
  if(myRole()&&!guard(a,ds)){toast(`Chức vụ ${myRole()} chỉ được xem phần này`);return}
  switch(a){
    case 'close':closeModal();break;
    case 'w-in':{const td=ymd(today()),at=S.attend[td]=S.attend[td]||{},recs=at[ds.id]=at[ds.id]||[],open=recs.find(r=>!r.out),nm=m2hm(nowMin());const st=S.staff.find(x=>x.id===ds.id);if(open)open.out=nm;else recs.push({in:nm,out:null});save();toast(`${st.name} ${open?'ra ca':'vào ca'} lúc ${nm}`);if(W.live&&W.date===td)W.T=Math.max(360,Math.min(1440,nowMin()));break}
    case 'w-new':staffModal(null);return;
    case 'w-edit':staffModal(S.staff.find(x=>x.id===ds.id));return;
    case 'w-del':S.staff=S.staff.filter(x=>x.id!==ds.id);delete W.chars[ds.id];if(W.sel===ds.id)W.sel=null;save();closeModal();toast('Đã xóa nhân viên');break;
    case 'w-step':W.live=false;W.T=Math.max(360,Math.min(1440,W.T+ +ds.n));worldRefresh();return;
    case 'w-now':W.date=ymd(today());W.T=Math.max(360,Math.min(1440,nowMin()));W.live=true;if(W.play){clearInterval(W.play);W.play=null}break;
    case 'w-play':if(W.play){clearInterval(W.play);W.play=null}else{W.live=false;if(W.T>=1435)W.T=360;W.play=setInterval(()=>{W.T+=5;if(W.T>=1440||cur()!=='nha-hang'){W.T=Math.min(W.T,1440);clearInterval(W.play);W.play=null;if(cur()==='nha-hang')render();return}worldRefresh()},110)}break;
    case 'hb-tab':U.hbTab=ds.k;U.hbDomain=null;break;
    case 'hb-dom':U.hbDomain=ds.id;closeModal();if(location.hash!=='#cam-nang'){location.hash='cam-nang';return}render();window.scrollTo(0,0);return;
    case 'hb-back':U.hbDomain=null;break;
    case 'toc':{ev.preventDefault();const el=document.getElementById('ls-'+ds.id);if(el)el.scrollIntoView({behavior:'smooth'});return}
    case 'lesson':lessonModal(ds.id);return;
    case 'learn':{if(S.learn[ds.id])delete S.learn[ds.id];else S.learn[ds.id]=1;save();const y=window.scrollY;const m=layer.querySelector('.modal');render();if(m)lessonModal(ds.id);window.scrollTo(0,y);return}
    case 'hb-cal':{const x=TASK[ds.id];const rp={week:'weekly',month:'monthly',quarter:'quarterly',year:'yearly'}[x.f];const ty={'nhan-su':'staff','hang-hoa':'supplier','ke-hoach':'marketing','van-hanh':'meeting'}[x.d.id]||'other';const t=today();const start=x.f==='week'?t:x.f==='month'?new Date(t.getFullYear(),t.getMonth()+1,1):x.f==='quarter'?new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3+3,1):new Date(t.getFullYear(),11,1);
      S.events.push({id:uid(),hbId:x.id,title:x.t,date:ymd(start),time:'',repeat:rp,type:ty,remind:{week:0,month:3,quarter:7,year:14}[x.f],note:x.kpi,done:{}});save();toast('Đã đưa vào lịch nhắc việc');const y=window.scrollY;const m=layer.querySelector('.modal');render();if(m)lessonModal(ds.id);window.scrollTo(0,y);return}
    case 'chk':{const c=S.chk[ds.k]=S.chk[ds.k]||{};if(c[ds.id])delete c[ds.id];else c[ds.id]=1;save();const y=window.scrollY;const lists=[...document.querySelectorAll('.ck-list')].map(l=>l.scrollTop);render();document.querySelectorAll('.ck-list').forEach((l,i)=>l.scrollTop=lists[i]||0);window.scrollTo(0,y);return}
    case 'path':{if(S.path[ds.id])delete S.path[ds.id];else S.path[ds.id]=1;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
    case 'plvl':U.planLevel=ds.l;break;
    case 'drill':U.planLevel=ds.l;U.planDate=parse(ds.d);closeModal();if(location.hash!=='#ke-hoach'){location.hash='ke-hoach';return}break;
    case 'goto-plan':U.planLevel=ds.l;U.planDate=today();return;
    case 'pshift':U.planDate=shift(U.planLevel,U.planDate,+ds.n);break;
    case 'ptoday':U.planDate=today();break;
    case 'rshift':U.revMonth=new Date(U.revMonth.getFullYear(),U.revMonth.getMonth()+ +ds.n,1);break;
    case 'rtoday':U.revMonth=new Date(today().getFullYear(),today().getMonth(),1);break;
    case 'cshift':U.calMonth=new Date(U.calMonth.getFullYear(),U.calMonth.getMonth()+ +ds.n,1);break;
    case 'ctoday':U.calMonth=new Date(today().getFullYear(),today().getMonth(),1);break;
    case 'nshift':U.notesYear+= +ds.n;break;
    case 'new-plan':planModal(null,ds.l,ds.d);return;
    case 'edit-plan':planModal(S.plans.find(x=>x.id===ds.id));return;
    case 'del-plan':S.plans=S.plans.filter(x=>x.id!==ds.id);save();closeModal();toast('Đã xóa kế hoạch');break;
    case 'cycle':{const x=S.plans.find(p=>p.id===ds.id);x.status={todo:'doing',doing:'done',done:'todo'}[x.status];delete x.s;save();const open=layer.innerHTML;render();if(open&&layer.querySelector('.modal'))b.closest('.item').outerHTML=planItem(x);return}
    case 'new-ev':evModal(null,ds.d);return;
    case 'edit-ev':evModal(S.events.find(x=>x.id===ds.id));return;
    case 'del-ev':S.events=S.events.filter(x=>x.id!==ds.id);save();closeModal();toast('Đã xóa lịch');break;
    case 'ev-done':{const e=S.events.find(x=>x.id===ds.id);e.done=e.done||{};if(e.done[ds.d])delete e.done[ds.d];else e.done[ds.d]=1;save();render();if(layer.querySelector('.modal'))b.closest('.item').outerHTML=evItem(e,parse(ds.d));return}
    case 'day':dayModal(ds.d);return;
    case 'quick-rev':revModal(ymd(today()));return;
    case 'edit-rev':revModal(ds.d);return;
    case 'del-rev':if(await ask(`Xóa doanh thu ngày ${dm(parse(ds.d))}?`,'Xóa')){delete S.revenue[ds.d];save()}break;
    case 'clear-target':delete S.targets[ds.k];save();break;
    case 'reset-note':delete S.notes[ds.m];save();break;
    case 'clear-sample':if(await ask('Xóa toàn bộ dữ liệu mẫu? Những gì bạn tự nhập vẫn giữ nguyên.','Xóa dữ liệu mẫu')){clearSample();toast('Đã xóa dữ liệu mẫu')}break;
    case 'load-sample':{const sm=seed();S.plans.push(...sm.plans);S.events.push(...sm.events);for(const k in sm.revenue)if(!S.revenue[k])S.revenue[k]=sm.revenue[k];sm.sampleTargets.forEach(k=>{if(S.targets[k]==null){S.targets[k]=sm.targets[k];S.sampleTargets.push(k)}});S.sample=true;save();break}
    case 'reset-all':if(await ask('Xóa tất cả dữ liệu trên máy này?','Xóa tất cả')){S=blank();save();toast('Đã xóa')}break;
    case 'copy-backup':{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast('Đã sao chép dữ liệu')}catch(e){const t=document.getElementById('backup-out');t.focus();t.select();toast('Nhấn Ctrl+C / Sao chép để lưu')}return}
    case 'download-backup':{try{const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download=`so-ke-hoach-${ymd(today())}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){}toast('Nếu file không tải về, dùng nút Sao chép dữ liệu');return}
    case 'restore':restore(document.getElementById('backup-in').value);return;
    case 'notify-on':try{const r=await Notification.requestPermission();if(r==='granted'){try{localStorage.removeItem(KEY+'.notified')}catch(e){}notifyToday();toast('Đã bật thông báo')}else toast('Trình duyệt chưa cho phép thông báo')}catch(e){toast('Trình duyệt này không hỗ trợ thông báo')}return;
    default:return;
  }
  render();
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  if(f.dataset.form==='profile'){const st=fd.staffId&&S.staff.find(x=>x.id===fd.staffId);S.profile={role:f.dataset.r,name:st?st.name:(fd.name||'').trim(),store:fd.store||'',staffId:fd.staffId||''};save();closeModal();toast('Đã vào app với chức vụ '+f.dataset.r);render();return}
  if(FORM_NEED[f.dataset.form]&&!FORM_NEED[f.dataset.form]()){toast('Chức vụ của bạn chỉ được xem phần này');return}
  if(f.dataset.form==='plan'&&!can(planKey(fd.level),'S')){toast('Chức vụ của bạn không được sửa kế hoạch cấp này');return}
  if(f.dataset.form==='target'){const v=parseMoney(fd.v);if(isNaN(v)){toast('Số tiền chưa đúng. VD: 900tr, 1,2 tỷ');return}S.targets[f.dataset.k]=v;S.sampleTargets=(S.sampleTargets||[]).filter(k=>k!==f.dataset.k);save();toast('Đã lưu mục tiêu')}
  if(f.dataset.form==='rev'){const v=parseMoney(fd.amount);if(isNaN(v)){toast('Số tiền chưa đúng. VD: 32tr hoặc 32.500.000');return}S.revenue[fd.date]={amount:v,guests:fd.guests?+fd.guests:0,note:fd.note||''};save();closeModal();toast(`Đã lưu ${fmt(v)} đ ngày ${dm(parse(fd.date))}`)}
  if(f.dataset.form==='plan'){if(!fd.title.trim())return;const d=parse(fd.date),key=period(fd.level,d).key;const id=f.dataset.id;
    if(id){const x=S.plans.find(p=>p.id===id);Object.assign(x,{title:fd.title.trim(),level:fd.level,date:fd.date,key,cat:fd.cat,status:fd.status,note:fd.note});delete x.s}
    else S.plans.push({id:uid(),level:fd.level,date:fd.date,key,title:fd.title.trim(),cat:fd.cat,status:fd.status,note:fd.note});save();closeModal();toast('Đã lưu kế hoạch')}
  if(f.dataset.form==='staff'){if(!fd.name.trim())return;const days=[0,1,2,3,4,5,6].filter(d=>fd['d'+d]);if(fd.shift&&!ranges(fd.shift).length){toast('Ca làm chưa đúng. VD: 08:00-14:00, 17:00-22:00');return}const id=f.dataset.id;const o={name:fd.name.trim(),role:fd.role,shift:fd.shift,days};
    if(id){const x=S.staff.find(p=>p.id===id);Object.assign(x,o);delete x.s}else S.staff.push({id:uid(),...o});save();closeModal();toast('Đã lưu nhân viên')}
  if(f.dataset.form==='ev'){if(!fd.title.trim())return;const id=f.dataset.id;const o={title:fd.title.trim(),date:fd.date,time:fd.time,repeat:fd.repeat,type:fd.type,remind:+fd.remind||0,note:fd.note};
    if(id){const x=S.events.find(p=>p.id===id);Object.assign(x,o);delete x.s}else S.events.push({id:uid(),done:{},...o});save();closeModal();toast('Đã lưu lịch')}
  render();
});
let noteT;document.addEventListener('input',e=>{if(e.target.id==='w-time'){W.T=+e.target.value;W.live=false;worldRefresh();return}const cb=e.target.closest&&e.target.closest('[data-calc]');if(cb){calcUpdate(cb);return}const m=e.target.dataset&&e.target.dataset.note;if(!m)return;clearTimeout(noteT);noteT=setTimeout(()=>{S.notes[m]=e.target.value;save()},400)});
document.addEventListener('change',e=>{if(e.target.id==='w-date'&&e.target.value){W.date=e.target.value;W.live=W.date===ymd(today())&&W.live;W.chars={};worldRefresh();render();return}if(e.target.id==='w-names'){W.names=e.target.checked;return}if(e.target.id!=='backup-file')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML&&!layer.querySelector('[data-locked-modal]'))closeModal()});
async function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('Dữ liệu không đúng định dạng sao lưu');return}if(!o||!o.v||!Array.isArray(o.plans)){toast('Dữ liệu không đúng định dạng sao lưu');return}if(!await ask('Thay dữ liệu hiện tại bằng bản sao lưu này?','Khôi phục'))return;S=o;const b=blank();for(const k in b)if(S[k]==null)S[k]=b[k];save();toast('Đã khôi phục');render()}
function notifyToday(){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;const k=ymd(today());if(localStorage.getItem(KEY+'.notified')===k)return;
    const items=upcoming(1).filter(u=>u.kind==='ev'||u.type!=='lunar'||u.i===0);const ps=S.plans.filter(x=>x.key===`D${k}`&&x.status!=='done');
    const lines=[...items.map(u=>`${u.i?'Mai':'Hôm nay'}: ${u.title}`),...ps.map(p=>`Việc: ${p.title}`)];
    if(lines.length)new Notification('Sổ Kế Hoạch Nhà Hàng',{body:lines.slice(0,6).join('\n')});localStorage.setItem(KEY+'.notified',k)}catch(e){}
}
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('[data-gantt]');if(!g)return;const b=g.getBoundingClientRect(),vb=g.viewBox.baseVal,x=(e.clientX-b.left)/b.width*vb.width;const L=112,m=360+(x-L)/(vb.width-L-6)*1080;if(m<360)return;W.T=Math.max(360,Math.min(1440,Math.round(m/5)*5));W.live=false;worldRefresh()});
setInterval(()=>{if(cur()==='nha-hang'&&W.live&&!W.play&&W.date===ymd(today())){W.T=Math.max(360,Math.min(1440,nowMin()));worldRefresh()}},30000);
window.addEventListener('resize',()=>{if(cur()==='nha-hang'){sizeCanvas();drawWorld()}});
window.addEventListener('hashchange',()=>{if(W.play){clearInterval(W.play);W.play=null}closeModal();render();window.scrollTo(0,0)});
load();render();notifyToday();
})();
</script>
